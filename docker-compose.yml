services:
  webserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: dn-cap60-webserver:nginx
    container_name: dn_cap60_webserver
    restart: unless-stopped
    ports:
      - "${WEBSERVER_PORT:-80}:80"
    volumes:
      - ./www:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
