server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;

    # Container health check endpoint
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Convenience fallback if launcher hits root /PatchConfigList.xml or /PatchInfoServer.cfg
    location = /PatchConfigList.xml {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        default_type application/xml;
        try_files $uri /Game/DragonNest/patch/PatchConfigList.xml =404;
    }

    location = /PatchInfoServer.cfg {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        default_type text/plain;
        try_files $uri /Game/DragonNest/patch/PatchInfoServer.cfg =404;
    }

    # DNLauncher requests uppercase .MD5 while files on disk may be lowercase .md5
    location ~* ^(.+\.(?:pak(?:\.\d+)?|txt))\.md5$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        default_type text/plain;
        try_files $uri $1.md5 $1.MD5 =404;
    }

    # Disable HTTP caching on launcher metadata and patch lists
    location ~* \.(?:xml|cfg|txt)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    # Patch archives (.pak and optional split parts; HTTP Range resume is enabled natively)
    location ~* \.pak(?:\.\d+)?$ {
        default_type application/octet-stream;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
